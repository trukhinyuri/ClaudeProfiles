name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build
        run: scripts/build-app.sh "${GITHUB_REF_NAME#v}"
      - name: Package
        run: ditto -c -k --keepParent "build/Claude Profiles.app" "ClaudeProfiles-${GITHUB_REF_NAME}.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" "ClaudeProfiles-${GITHUB_REF_NAME}.zip" --title "Claude Profiles ${GITHUB_REF_NAME}" --notes "$notes"
