name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent build/ClaudeUnlimited.app ClaudeUnlimited.zip
      - uses: actions/upload-artifact@v5
        with:
          name: ClaudeUnlimited
          path: ClaudeUnlimited.zip
